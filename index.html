<!DOCTYPE html>
<!-- data-shell="desktop" ne dit PAS « on est sur un bureau ». Il dit « la couche
     bureau est chargée sur cette page ». Le vrai seuil est ailleurs, dans le CSS :
     styles-desktop.css et desktop-v2.css n'ont AUCUNE règle hors
     @media (min-width:1100px) — vérifié à la fusion. Sous 1100 px, l'attribut est
     posé et rigoureusement inerte : l'app redevient exactement la version mobile.
     Il reste écrit en dur plutôt que calculé en JS parce qu'environ 250 sélecteurs
     le portent : le renommer serait un grand diff pour aucun gain. -->
<html lang="fr" data-shell="desktop">
<head>
<meta charset="UTF-8">
<!-- v2.95 — RETOUR à `resizes-content`. La v2.94 était passée en
     `resizes-visual` pour figer la vue de mise en page ; ça a bien supprimé le
     clignotement, et ça a rendu la feuille inutilisable : ancrée au bas d'une
     vue qui garde toute sa hauteur, sa moitié basse passait SOUS le clavier —
     champs, « Ajouter », « Photo », « Fichier » invisibles — et `.slist`,
     n'ayant plus rien à déborder, avalait le glissé sans rien faire défiler
     pendant qu'`overscroll-behavior:contain` l'empêchait de le rendre à la vue
     visuelle. En `resizes-content`, la vue s'arrête au-dessus du clavier et la
     feuille tient entière dedans. Le seuil de plafonnement qui causait le
     clignotement est traité ailleurs, dans app.js : la feuille de capture
     reçoit `tall`. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sable</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F2E9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14110C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sable">
<!-- Geist et Geist Mono ne viennent plus de Google Fonts : elles sont dans fonts/,
     déclarées en @font-face au début de styles.css (ticket #11). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./styles.css">
<!-- La couche bureau, fondue ici depuis index-desktop.html. L'ordre compte :
     elles viennent APRÈS styles.css et ne redéfinissent aucun token.

     L'INTERRUPTEUR D'ARRÊT survit à la fusion : retirer ces deux lignes et les
     deux <script> du bas rend exactement l'app mobile, à toute largeur. Il ne
     tient QUE parce que styles.css masque par défaut les quatre nœuds propres au
     bureau (.dk-railhead, .dk-keys, .dk-close, .dk-empty) — sans cette règle ils
     réapparaîtraient en texte nu dès la couche retirée. Mesuré à la fusion : à
     390 px, la page rend exactement comme avant, zéro différence sur 17 éléments
     et 17 propriétés calculées. -->
<link rel="stylesheet" href="./styles-desktop.css">
<link rel="stylesheet" href="./desktop-v2.css">
<!-- Ticket E — le panneau de fiche en lecture d'abord. Surcouche à part, avec
     son propre interrupteur : retirer cette ligne et son <script> rend la fiche
     d'avant sans toucher au reste du bureau. -->
<link rel="stylesheet" href="./desktop-fiche.css">
</head>
<body>
<div id="app">
  <div id="hdrSentinel" aria-hidden="true"></div>
  <!-- v2.84 — LE CADRE DE LA REMONTÉE. Il vit AU-DESSUS de l'en-tête, et cette
       place n'est pas un détail : un titre nomme ce qui est dessous, donc rien
       ne doit s'intercaler entre « Catégories » et sa grille. Sous l'en-tête, le
       cadre les décollait — c'est de là que venait la sensation d'hybride, pas
       de sa forme. Il est hors du rail (#tabViewport) pour ne pas être rogné par
       son overflow, et sous #hdrSentinel pour ne pas fausser la sentinelle. -->
  <div id="riseFrame"></div>
  <!-- En-tête consolidé (v2.42) : UNE ligne. Le titre EST le menu de vue — tout
       ce qui pilotait une bande sous l'en-tête (sélecteur d'index, axe
       d'affichage) passe derrière lui. La recherche redevient une loupe : zéro
       hauteur au repos, le champ remplace la ligne du titre quand on l'ouvre.
       Le wordmark quitte l'en-tête : une animation ne vaut que regardée, et
       personne ne fixe son en-tête — il vit maintenant en tête des Réglages et
       sur l'écran de connexion. -->
  <header class="topbar">
    <div class="tbrow" id="tbRow">
      <button class="navtitle" id="navTitle" aria-expanded="false" aria-controls="viewBandCat" aria-label="Changer la vue">
        <span class="tt" id="navTitleTxt">Collection</span>
        <span class="tcv"><svg class="chv" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
      </button>
      <!-- v2.45 — les deux lignes d'état de Collection deviennent deux pastilles.
           Une ligne qui dit « il y a 3 items » coûte 48 px à chaque ouverture pour
           un fait qui tient dans un point. Le point ne réclame rien : il signale.
           Le filtre de Ma pile les remplace sur l'autre onglet — même emplacement,
           jamais les deux à la fois. -->
      <!-- v2.63 — les deux pastilles (remontée + non classés) fondent en UNE.
           Un tap ouvre le menu « À trier » où l'on choisit la destination ; le
           point signale toujours qu'il y a quelque chose, il ne dit plus quoi. -->
      <button id="inboxBtn" class="btn icon" aria-label="À trier" title="À trier" aria-expanded="false" hidden>
        <svg class="ic"><use href="icons.svg#inbox"/></svg><span class="bdg" hidden></span>
      </button>
      <button id="filterBtn" class="btn icon" aria-label="Filtrer" title="Filtrer" aria-expanded="false" aria-controls="filterBand" hidden>
        <svg class="ic"><use href="icons.svg#filter"/></svg>
      </button>
      <button id="searchBtn" class="btn icon" aria-label="Chercher" title="Chercher">
        <svg class="ic"><use href="icons.svg#search"/></svg>
      </button>
      <button id="settingsBtn" class="btn icon" aria-label="Réglages" title="Réglages">
        <svg class="ic"><use href="icons.svg#gear"/></svg>
      </button>
    </div>
    <div class="tbsearch" id="tbSearch" hidden>
      <svg class="ic"><use href="icons.svg#search"/></svg>
      <input id="searchInput" placeholder="Chercher dans toute ta pile…" autocomplete="off" aria-label="Chercher dans toute ta pile">
      <button class="scancel" id="searchCancel" aria-label="Annuler la recherche">✕</button>
    </div>
  </header>
  <!-- Résultats de recherche : globaux, puisque le champ l'est. -->
  <div id="rootResults" hidden></div>
  <input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
  <input type="file" id="fFile" accept="image/*,audio/*,video/*" multiple hidden>

  <!-- v2.84 — le popover « À trier » est SUPPRIMÉ. Il disait « La remontée · 3 »
       et « Non classés · 7 » ; le cadre dit exactement la même chose, avec les
       images en plus. Deux réponses à une même question, c'était le doublon que
       ce projet paie depuis le début. L'enveloppe bascule désormais le cadre. -->

  <div class="viewport" id="tabViewport">
  <div class="track" id="tabTrack">

  <section id="tab-categories" class="tabcur">
    <!-- v2.69 — la fente de bandeau de Collection. Hors de #rootBrowse : un
         rendu de l'index ne doit pas pouvoir emporter le panneau ouvert. -->
    <div id="viewBandCat" class="fband"></div>
    <div id="rootBrowse">
      <!-- v2.45 : #riseLine (ch. 22) et #unfiledLine sont partis dans l'en-tête,
           en pastilles. Avec #idxSeg et .cathead retirés en v2.42, il ne reste
           RIEN entre l'en-tête et la première catégorie : l'écran de Collection
           est enfin ce qu'il prétend être — un index. -->
      <div class="domgrid" id="domGrid"></div>
      <!-- Le ⋯ de Collection n'avait plus qu'un choix — une odeur relevée depuis
           la v2.38. Il est tranché par soustraction : « Nouvelle catégorie »
           devient une ligne fantôme nommée en pied de l'index, jamais un second
           `+` (l'app en a déjà un, flottant). -->
      <div id="newCatLine"></div>
      <div id="idxList"></div>
      <button class="rowlink" id="openArch"><span>Mis de côté</span><span class="n" id="archN"></span></button>
      <button class="rowlink" id="openTrash"><span>Corbeille</span><span class="n" id="trashN"></span></button>

    </div>
    <input type="file" id="fImport" accept="application/json,.json" hidden>
  </section>

  <section id="tab-pile" hidden>
    <!-- v2.55 — en-tête propre de la surface de périmètre : retour · titre · tri.
         N'apparaît QUE quand un périmètre est ouvert (body.scoped) ; le reste du
         temps #tab-pile est l'onglet Ma pile, sans cet en-tête. -->
    <div class="scopehead" id="scopeHead">
      <button class="btn icon" id="scopeBack" aria-label="Retour à Collection"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="scopetitle" id="scopeTitle"></span>
      <button class="btn icon" id="scopeSort" aria-label="Vue et tri"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4v16M8 4 5 7M8 4l3 3M16 20V4M16 20l-3-3M16 20l3-3"/></svg></button>
    </div>
    <div class="pilehead">
    <!-- v2.45 — le fil d'Ariane est supprimé, ses trois éléments avec lui.
         Le chevron : sur l'accueil il n'avait rien à remonter (et un bug de six
         versions l'y affichait quand même) ; ailleurs, le périmètre se retire
         maintenant par sa puce, et le retour d'Android fait le reste (v2.44).
         Le compte : déjà supprimé une fois de l'en-tête au chantier 11, pour la
         même raison — il n'est pas consulté. Le ✓ : il disait « il faut choisir
         quelque chose » à quelqu'un qui venait lire. Sélectionner entre par
         l'appui long, qui existe depuis toujours, et par le menu du titre. -->
    <div class="selbar" id="pileSelbar">
      <span class="seln" id="selN">0 sélectionné</span>
      <button class="sellnk" id="selAll">Tout</button>
      <button class="sellnk" id="selCancel">Annuler</button>
    </div>
    </div>
    <!-- v2.69 — la fente de bandeau de Ma pile. Le titre (ou le ⇅ de la surface)
         l'ouvre ; jamais en même temps que le bandeau de filtrage. -->
    <div id="viewBandPile" class="fband"></div>
    <div id="pinnedRow" class="pinnedrow" hidden></div>
    <!-- v2.68 — le bandeau de filtrage. Il vit ICI, entre l'en-tête et la liste :
         l'entonnoir l'ouvre juste en dessous de lui-même et la liste descend.
         Vide au repos (0 nœud, 0 px), rempli par renderFilterBand(). -->
    <div id="filterBand" class="fband"></div>
    <div id="filterState" class="fstate" hidden></div>
    <div id="pileList"></div>
  </section>

  </div>
  </div>

  <!-- Un seul bouton flottant dans toute l'app : deux actions principales
       sur un écran, c'est aucune. Masqué en sélection et pendant un glissé. -->
  <button class="jfab" id="fabJump" aria-label="Accès directs" title="Accès directs" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="m17 14 3 3 3-3"/><path d="M20 8v9"/></svg></button>
  <button class="fab" id="fabAdd" aria-label="Ajouter un item" title="Ajouter un item"><svg class="ic"><use href="icons.svg#plus"/></svg></button>

  <!-- Chantier 22 : deux onglets. Collection en tête — elle est l'accueil depuis
       la v2.38, elle doit être au DÉPART du glissé et non à son bout. La remontée
       n'a plus d'onglet : elle s'invoque depuis l'accueil. -->
  <!-- Le rail de bureau EST cette barre d'onglets : au-delà de 1100 px elle passe
       en colonne fixe à gauche (styles-desktop.css), sans qu'aucun nœud
       supplémentaire n'enveloppe l'app. .dk-railhead et .dk-keys sont ses deux
       ajouts propres au bureau ; sous 1100 px ils sont mis en display:none par le
       bloc @media (max-width:1099px) de styles-desktop.css — la seule chose que ce
       fichier fait sous le seuil. Les quatre raccourcis annoncés sont tenus par
       desktop.js (flèches, Entrée, / et Échap dans son gestionnaire keydown) ;
       ne pas en ajouter un cinquième sans l'implémenter là-bas. -->
  <nav class="tabs">
    <div class="dk-railhead"><span class="wordmark"><span class="sable-ink">Sable</span><sup class="appver" id="dkVer"></sup></span></div>
    <button data-tab="categories" class="active"><svg class="ic"><use href="icons.svg#grid"/></svg>Collection</button>
    <button data-tab="pile"><svg class="ic"><use href="icons.svg#pile"/></svg>Ma pile</button>
    <div class="dk-keys">
      <div class="dk-keys-t">Raccourcis</div>
      <div><kbd>↑</kbd><kbd>↓</kbd>parcourir la liste</div>
      <div><kbd>Entrée</kbd>ouvrir le lien</div>
      <div><kbd>/</kbd>chercher</div>
      <div><kbd>Échap</kbd>fermer le panneau</div>
    </div>
  </nav>

  <div class="batchbar" id="batchBar">
    <button class="batchbtn primary" id="batchCat"><svg class="ic"><use href="icons.svg#grid"/></svg>Catégorie</button>
    <button class="batchbtn" id="batchTag"><span class="taghash">#</span>Tag</button>
  </div>
</div>

<div id="authgate" class="authgate" hidden>
  <div class="authcard">
    <div class="wordmark"><span class="sable-ink">Sable</span></div>
    <p class="authsub">Connecte-toi pour retrouver ta pile sur tous tes appareils.</p>
    <input id="authEmail" class="search" type="email" placeholder="ton@email.com" autocomplete="email" inputmode="email">
    <button id="authBtn" class="authbtn">Recevoir le lien de connexion</button>
    <div id="authMsg" class="authmsg"></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="appSheet" role="dialog" aria-label="Panneau">
  <div class="grab"></div>
  <div class="shead"><h2 id="sheetTitle"></h2><div class="sheadact" id="sheetHeadAct"></div></div>
  <div class="slist" id="sheetList"></div>
  <div class="sfoot" id="sheetFoot" hidden></div>
  <!-- v2.67 : la couche de choix (categorie, tags). Vide au repos, remplie par
       openPickLayer() ; elle vit DANS la feuille pour glisser par-dessus elle
       sans repousser son contenu. -->
  <div class="pklayer" id="pkLayer" hidden></div>
  <!-- v2.71 : la couche du VISUEL (icône, couverture). Deuxieme element et non
       reutilisation de #pkLayer : les deux couches ont chacune leur etat et leur
       nom dans la pile, et une couche qui se reecrit sous elle-meme perdrait le
       retour systeme. -->
  <div class="pklayer" id="icLayer" hidden></div>
</div>

<!-- Les deux compagnons de la colonne de droite au bureau. Leur PLACE est une
     contrainte, pas un choix : styles-desktop.css les révèle par
     `.sheet.open ~ .dk-close` — un sélecteur de frère suivant. Déplacés avant
     #appSheet, ou emboîtés dans un parent, ils ne s'afficheraient plus jamais.
     Inertes sous 1100 px (display:none par le bloc @media (max-width:1099px)). -->
<button class="dk-close" id="dkClose" aria-label="Fermer le panneau" title="Fermer (Échap)">✕</button>
<div class="dk-empty" id="dkEmpty">
  <div class="dk-empty-mark">S</div>
  <div class="dk-empty-t">Rien de sélectionné</div>
  <div class="dk-empty-s">Clique un item : sa fiche s'ouvre ici, sans quitter la liste.</div>
</div>

<!-- Chantier 22 : la remontée invoquée. Plein écran et HORS de la piste des
     onglets : ce n'est pas un lieu où l'on navigue, c'est un rituel qui commence
     et qui finit — la seule clôture que l'app possède. Progression et compteur
     n / N en haut, la carte au centre, deux cartes décalées derrière elle. -->
<div id="rise" class="rise" hidden>
  <div class="risebar">
    <div class="riseprog" id="riseProg"></div>
    <span class="risen" id="riseN"></span>
    <button class="risex" id="riseClose" aria-label="Fermer la remontée">✕</button>
  </div>
  <div class="risebody"><div id="stage"></div></div>
</div>

<div id="lightbox" class="lightbox" hidden></div>
<div id="toast"></div>

<script src="./onboarding.js"></script>
<script src="./app.js"></script>
<!-- L'ordre est une dépendance, pas une préférence : desktop.js enveloppe des
     fonctions globales d'app.js (donc APRÈS lui), desktop-v2.js enveloppe à son
     tour celles de desktop.js (donc APRÈS lui), et les deux doivent précéder la
     config — c'est elle qui appelle startApp(). Les deux fichiers s'exécutent à
     toute largeur, mais tout ce qu'ils font de VISIBLE est gardé par
     `if(!DK.matches)` (DK = matchMedia 1100px). Vérifié à la fusion : le seul
     effet non gardé est le recâblage de fabAdd / batchCat / batchTag /
     settingsBtn, et les quatre fonctions d'app.js visées ne prennent aucun
     paramètre et ne lisent pas `this` — le recâblage est donc équivalent. -->
<script src="./desktop.js"></script>
<script src="./desktop-v2.js"></script>
<script src="./desktop-fiche.js"></script>
<script>
/* =================== CONFIG — À REMPLIR =================== */
const SUPABASE_URL     = "https://jwplfeziaivveodtgczh.supabase.co";
const SUPABASE_ANON_KEY= "sb_publishable_AERyGrp8psPJTn9vxAKMWg_Zl4JljdP";
/* ---- Aperçus des liens ----
   1) META_API : service qui renvoie titre + image d'une page en JSON (compatible
      navigateur / CORS). Par défaut Microlink : sans clé, ~50 requêtes/jour, et il
      lance un vrai navigateur → il lit même les pages rendues en JavaScript.
      Marche pour Reddit, Telegram, Pinterest, Behance, Vimeo, presse/blogs…
      ⚠️ Instagram & X/Twitter : souvent KO en gratuit (mur de connexion / anti-bot).
      L’item est quand même créé — tu ajoutes titre + aperçu à la main dans la fiche.
   2) IMG_PROXY : fait passer l'image d'aperçu par un cache d'images (wsrv.nl) pour
      contourner les blocages « anti-hotlink » (sinon l'image renvoie une erreur et
      n'apparaît pas). Mets "" pour désactiver.
   3) LINK_PROXY : repli si META_API échoue — proxy qui renvoie le HTML brut, dont on
      lit les balises Open Graph. Optionnel ("" pour aucun repli). allorigins est
      instable ; alternative possible : "https://corsproxy.io/?url=". */
/* ---- Aperçu « maison » (recommandé) ----
   Ta propre Edge Function Supabase récupère l'aperçu côté serveur, comme WhatsApp,
   sans dépendre d'un service tiers ni buter sur le CORS du navigateur.
   → déploie d'abord la fonction (fichier link-preview.ts), PUIS mets ici le NOM
     exact de ta fonction Supabase. Chez toi elle s'appelle "clever-action".
     (Si tu la recrées un jour sous un autre nom, change juste la ligne ci-dessous.)
     C'est essayé EN PREMIER ; repli auto sur les autres. Vide = désactivé. */
const SELF_META_FN = "clever-action";
const META_API   = "https://api.microlink.io/?url=";
/* Reddit / X / sites qui bloquent les robots : Microlink gratuit se fait bloquer.
   Exabase passe l'anti-bot (rotation de proxys + rendu JS) — 20 000 aperçus/mois GRATUITS.
   → crée un compte sur exabase.io, copie ta clé, colle-la ci-dessous. Vide = désactivé.
   ⚠️ la clé est visible dans le code source (ok pour un usage perso). */
const META_EXABASE_KEY = "";
const IMG_PROXY  = "https://wsrv.nl/?url=";
const LINK_PROXY = "https://api.allorigins.win/raw?url=";
/* ========================================================= */
applyTheme();
const _sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let USER=null;
/* Couche de stockage synchronisée : même interface que window.storage, adossée à une table "kv" Supabase */
window.storage={
  async get(key){const{data,error}=await _sb.from('kv').select('value').eq('user_id',USER.id).eq('key',key).maybeSingle();if(error)throw error;return data?{key,value:data.value}:null;},
  async set(key,value){const{error}=await _sb.from('kv').upsert({user_id:USER.id,key,value,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});if(error)throw error;return{key,value};},
  async delete(key){await _sb.from('kv').delete().eq('user_id',USER.id).eq('key',key);return{key,deleted:true};},
  async list(prefix){let q=_sb.from('kv').select('key').eq('user_id',USER.id);if(prefix)q=q.like('key',prefix.replace(/[%_\\]/g,'\\$&')+'%');const{data}=await q;return{keys:(data||[]).map(r=>r.key)};}
};
const gate=document.getElementById('authgate');
const authMsg=document.getElementById('authMsg');
const authBtn=document.getElementById('authBtn');
const authEmail=document.getElementById('authEmail');
let started=false;
function showApp(){gate.hidden=true;if(!started){started=true;startApp();}}
function showGate(){gate.hidden=false;}
function onSession(session){if(session&&session.user){USER=session.user;showApp();}else{showGate();}}
authBtn.onclick=async()=>{
  const email=(authEmail.value||'').trim();
  if(!email){authMsg.textContent='Entre ton e-mail.';return;}
  authBtn.disabled=true;authMsg.textContent='Envoi du lien…';
  const{error}=await _sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});
  authBtn.disabled=false;
  authMsg.textContent=error?('Erreur : '+error.message):'Lien envoyé ! Ouvre-le sur cet appareil pour te connecter.';
};
authEmail.addEventListener('keydown',e=>{if(e.key==='Enter')authBtn.click();});
const _so=document.getElementById('signout');
if(_so)_so.onclick=async()=>{await _sb.auth.signOut();location.reload();};
_sb.auth.onAuthStateChange((_e,session)=>onSession(session));
(async()=>{const{data:{session}}=await _sb.auth.getSession();onSession(session);})();
</script>
</body>
</html>
