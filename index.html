<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sable</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F2E9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14110C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sable">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <div id="hdrSentinel" aria-hidden="true"></div>
  <!-- En-tête consolidé (v2.42) : UNE ligne. Le titre EST le menu de vue — tout
       ce qui pilotait une bande sous l'en-tête (sélecteur d'index, axe
       d'affichage) passe derrière lui. La recherche redevient une loupe : zéro
       hauteur au repos, le champ remplace la ligne du titre quand on l'ouvre.
       Le wordmark quitte l'en-tête : une animation ne vaut que regardée, et
       personne ne fixe son en-tête — il vit maintenant en tête des Réglages et
       sur l'écran de connexion. -->
  <header class="topbar">
    <div class="tbrow" id="tbRow">
      <button class="navtitle" id="navTitle" aria-haspopup="dialog" aria-label="Changer la vue">
        <span class="tt" id="navTitleTxt">Collection</span>
        <span class="tcv"><svg class="chv" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
      </button>
      <button id="searchBtn" class="btn icon" aria-label="Chercher" title="Chercher">
        <svg class="ic"><use href="icons.svg#search"/></svg>
      </button>
      <button id="settingsBtn" class="btn icon" aria-label="Réglages" title="Réglages">
        <svg class="ic"><use href="icons.svg#gear"/></svg>
      </button>
    </div>
    <div class="tbsearch" id="tbSearch" hidden>
      <svg class="ic"><use href="icons.svg#search"/></svg>
      <input id="searchInput" placeholder="Chercher dans toute ta pile…" autocomplete="off" aria-label="Chercher dans toute ta pile">
      <button class="scancel" id="searchCancel" aria-label="Annuler la recherche">✕</button>
    </div>
  </header>
  <!-- Résultats de recherche : globaux, puisque le champ l'est. -->
  <div id="rootResults" hidden></div>
  <input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
  <input type="file" id="fFile" accept="image/*,audio/*,video/*" multiple hidden>

  <div class="viewport" id="tabViewport">
  <div class="track" id="tabTrack">

  <section id="tab-categories" class="tabcur">
    <div id="rootBrowse">
      <!-- Chantier 22 : l'invitation à la remontée. UNE ligne, et seulement s'il y
           a un tirage — elle disparaît quand le rituel est fini. Elle est au-dessus
           du sélecteur d'index parce qu'elle ne dépend pas de ce qu'on parcourt :
           c'est l'accueil qui parle, pas l'index. -->
      <div id="riseLine" hidden></div>
      <!-- v2.42 : #idxSeg (le sélecteur d'index, chantier 15) et .cathead (l'axe
           d'affichage du 18 + le ⋯ du 28) sont supprimés. Leurs réglages vivent
           derrière le titre, dans la feuille « Vue » : un contrôle rare ne mérite
           pas le loyer d'un bandeau permanent. Deux bandes de moins en tête. -->
      <div id="unfiledLine"></div>
      <div class="domgrid" id="domGrid"></div>
      <!-- Le ⋯ de Collection n'avait plus qu'un choix — une odeur relevée depuis
           la v2.38. Il est tranché par soustraction : « Nouvelle catégorie »
           devient une ligne fantôme nommée en pied de l'index, jamais un second
           `+` (l'app en a déjà un, flottant). -->
      <div id="newCatLine"></div>
      <div id="idxList"></div>
      <button class="rowlink" id="openArch"><span>Mis de côté</span><span class="n" id="archN"></span></button>
      <button class="rowlink" id="openTrash"><span>Corbeille</span><span class="n" id="trashN"></span></button>

    </div>
    <input type="file" id="fImport" accept="application/json,.json" hidden>
  </section>

  <section id="tab-pile" hidden>
    <div class="pilehead">
    <div class="crumb" id="crumb">
      <button class="back" id="crumbBack" hidden aria-label="Remonter d'un cran" title="Remonter d'un cran"><svg class="ic"><use href="icons.svg#chevron-left"/></svg></button>
      <div class="path"><span class="cur" id="crumbCur"></span><span class="cnt" id="crumbCnt"></span></div>
      <button class="pill" id="selBtn" aria-label="Sélectionner" title="Sélectionner"><svg class="ic"><use href="icons.svg#check"/></svg></button>
    </div>
    <div class="selbar" id="pileSelbar">
      <span class="seln" id="selN">0 sélectionné</span>
      <button class="sellnk" id="selAll">Tout</button>
      <button class="sellnk" id="selCancel">Annuler</button>
    </div>
    </div>
    <div id="pinnedRow" class="pinnedrow" hidden></div>
    <div id="filterState" class="fstate" hidden></div>
    <div class="pilesearch"><svg class="ic"><use href="icons.svg#search"/></svg><input id="pileSearch" placeholder="Rechercher dans cette pile…" autocomplete="off" aria-label="Rechercher dans la pile"></div>
    <div id="pileList"></div>
  </section>

  </div>
  </div>

  <!-- Un seul bouton flottant dans toute l'app : deux actions principales
       sur un écran, c'est aucune. Masqué en sélection et pendant un glissé. -->
  <button class="fab" id="fabAdd" aria-label="Ajouter un item" title="Ajouter un item"><svg class="ic"><use href="icons.svg#plus"/></svg></button>

  <!-- Chantier 22 : deux onglets. Collection en tête — elle est l'accueil depuis
       la v2.38, elle doit être au DÉPART du glissé et non à son bout. La remontée
       n'a plus d'onglet : elle s'invoque depuis l'accueil. -->
  <nav class="tabs">
    <button data-tab="categories" class="active"><svg class="ic"><use href="icons.svg#grid"/></svg>Collection</button>
    <button data-tab="pile"><svg class="ic"><use href="icons.svg#pile"/></svg>Ma pile</button>
  </nav>

  <div class="batchbar" id="batchBar">
    <button class="batchbtn primary" id="batchCat"><svg class="ic"><use href="icons.svg#grid"/></svg>Catégorie</button>
    <button class="batchbtn" id="batchTag"><span class="taghash">#</span>Tag</button>
  </div>
</div>

<div id="authgate" class="authgate" hidden>
  <div class="authcard">
    <div class="wordmark"><span class="sable-ink">Sable</span></div>
    <p class="authsub">Connecte-toi pour retrouver ta pile sur tous tes appareils.</p>
    <input id="authEmail" class="search" type="email" placeholder="ton@email.com" autocomplete="email" inputmode="email">
    <button id="authBtn" class="authbtn">Recevoir le lien de connexion</button>
    <div id="authMsg" class="authmsg"></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="appSheet" role="dialog" aria-label="Panneau">
  <div class="grab"></div>
  <div class="shead"><h2 id="sheetTitle"></h2><div class="sheadact" id="sheetHeadAct"></div></div>
  <div class="slist" id="sheetList"></div>
  <div class="sfoot" id="sheetFoot" hidden></div>
</div>

<!-- Chantier 22 : la remontée invoquée. Plein écran et HORS de la piste des
     onglets : ce n'est pas un lieu où l'on navigue, c'est un rituel qui commence
     et qui finit — la seule clôture que l'app possède. Progression et compteur
     n / N en haut, la carte au centre, deux cartes décalées derrière elle. -->
<div id="rise" class="rise" hidden>
  <div class="risebar">
    <div class="riseprog" id="riseProg"></div>
    <span class="risen" id="riseN"></span>
    <button class="risex" id="riseClose" aria-label="Fermer la remontée">✕</button>
  </div>
  <div class="risebody"><div id="stage"></div></div>
</div>

<div id="lightbox" class="lightbox" hidden></div>
<div id="toast"></div>

<script src="./app.js"></script>
<script>
/* =================== CONFIG — À REMPLIR =================== */
const SUPABASE_URL     = "https://jwplfeziaivveodtgczh.supabase.co";
const SUPABASE_ANON_KEY= "sb_publishable_AERyGrp8psPJTn9vxAKMWg_Zl4JljdP";
/* ---- Aperçus des liens ----
   1) META_API : service qui renvoie titre + image d'une page en JSON (compatible
      navigateur / CORS). Par défaut Microlink : sans clé, ~50 requêtes/jour, et il
      lance un vrai navigateur → il lit même les pages rendues en JavaScript.
      Marche pour Reddit, Telegram, Pinterest, Behance, Vimeo, presse/blogs…
      ⚠️ Instagram & X/Twitter : souvent KO en gratuit (mur de connexion / anti-bot).
      L’item est quand même créé — tu ajoutes titre + aperçu à la main dans la fiche.
   2) IMG_PROXY : fait passer l'image d'aperçu par un cache d'images (wsrv.nl) pour
      contourner les blocages « anti-hotlink » (sinon l'image renvoie une erreur et
      n'apparaît pas). Mets "" pour désactiver.
   3) LINK_PROXY : repli si META_API échoue — proxy qui renvoie le HTML brut, dont on
      lit les balises Open Graph. Optionnel ("" pour aucun repli). allorigins est
      instable ; alternative possible : "https://corsproxy.io/?url=". */
/* ---- Aperçu « maison » (recommandé) ----
   Ta propre Edge Function Supabase récupère l'aperçu côté serveur, comme WhatsApp,
   sans dépendre d'un service tiers ni buter sur le CORS du navigateur.
   → déploie d'abord la fonction (fichier link-preview.ts), PUIS mets ici le NOM
     exact de ta fonction Supabase. Chez toi elle s'appelle "clever-action".
     (Si tu la recrées un jour sous un autre nom, change juste la ligne ci-dessous.)
     C'est essayé EN PREMIER ; repli auto sur les autres. Vide = désactivé. */
const SELF_META_FN = "clever-action";
const META_API   = "https://api.microlink.io/?url=";
/* Reddit / X / sites qui bloquent les robots : Microlink gratuit se fait bloquer.
   Exabase passe l'anti-bot (rotation de proxys + rendu JS) — 20 000 aperçus/mois GRATUITS.
   → crée un compte sur exabase.io, copie ta clé, colle-la ci-dessous. Vide = désactivé.
   ⚠️ la clé est visible dans le code source (ok pour un usage perso). */
const META_EXABASE_KEY = "";
const IMG_PROXY  = "https://wsrv.nl/?url=";
const LINK_PROXY = "https://api.allorigins.win/raw?url=";
/* ========================================================= */
applyTheme();
const _sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let USER=null;
/* Couche de stockage synchronisée : même interface que window.storage, adossée à une table "kv" Supabase */
window.storage={
  async get(key){const{data,error}=await _sb.from('kv').select('value').eq('user_id',USER.id).eq('key',key).maybeSingle();if(error)throw error;return data?{key,value:data.value}:null;},
  async set(key,value){const{error}=await _sb.from('kv').upsert({user_id:USER.id,key,value,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});if(error)throw error;return{key,value};},
  async delete(key){await _sb.from('kv').delete().eq('user_id',USER.id).eq('key',key);return{key,deleted:true};},
  async list(prefix){let q=_sb.from('kv').select('key').eq('user_id',USER.id);if(prefix)q=q.like('key',prefix.replace(/[%_\\]/g,'\\$&')+'%');const{data}=await q;return{keys:(data||[]).map(r=>r.key)};}
};
const gate=document.getElementById('authgate');
const authMsg=document.getElementById('authMsg');
const authBtn=document.getElementById('authBtn');
const authEmail=document.getElementById('authEmail');
let started=false;
function showApp(){gate.hidden=true;if(!started){started=true;startApp();}}
function showGate(){gate.hidden=false;}
function onSession(session){if(session&&session.user){USER=session.user;showApp();}else{showGate();}}
authBtn.onclick=async()=>{
  const email=(authEmail.value||'').trim();
  if(!email){authMsg.textContent='Entre ton e-mail.';return;}
  authBtn.disabled=true;authMsg.textContent='Envoi du lien…';
  const{error}=await _sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});
  authBtn.disabled=false;
  authMsg.textContent=error?('Erreur : '+error.message):'Lien envoyé ! Ouvre-le sur cet appareil pour te connecter.';
};
authEmail.addEventListener('keydown',e=>{if(e.key==='Enter')authBtn.click();});
const _so=document.getElementById('signout');
if(_so)_so.onclick=async()=>{await _sb.auth.signOut();location.reload();};
_sb.auth.onAuthStateChange((_e,session)=>onSession(session));
(async()=>{const{data:{session}}=await _sb.auth.getSession();onSession(session);})();
</script>
</body>
</html>
